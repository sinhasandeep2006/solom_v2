<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Your Wishlist — SOLOMO ESSENTIALS</title>
<meta name="description" content="Shop the full range of SOLOMO ESSENTIALS bamboo tissues, wipes and bundles."/>
<link href="assets/img/favicon.png" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="assets/js/tw.js"></script>
<link href="assets/site.css" rel="stylesheet"/>
<script>window.SOLOMO_BASE = '';</script>
<script src="assets/js/solomo.js"></script>
<script src="assets/js/chrome.js"></script>
</head>
<body class="bg-cream-bg font-sans text-navy-brand antialiased selection:bg-orange-light selection:text-orange-brand">
<script>siteHeader()</script>
<main class="max-w-7xl mx-auto px-6 lg:px-10 py-8 lg:py-12" id="catalog">
<h1 class="text-2xl sm:text-3xl font-bold text-navy-brand tracking-tight" id="search-heading">Your Wishlist</h1>
<p class="text-sm text-slate-body mt-1"><span id="result-count">6 products</span></p>



<h2 class="sr-only">Products</h2>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-x-5 gap-y-10 mt-8" data-cards="all" id="product-grid"></div>
<p aria-live="polite" class="text-center text-sm text-slate-body mt-10" hidden id="no-results"></p>
<div class="text-center py-16" hidden id="wish-empty">
<span aria-hidden="true" class="material-symbols-outlined text-5xl text-orange-brand">favorite</span>
<p class="text-lg font-bold text-navy-brand mt-3">Your wishlist is empty</p>
<p class="text-sm text-slate-body mt-1">Tap the heart on any product to save it here.</p>
<a class="inline-flex items-center gap-2 mt-6 bg-orange-brand hover:bg-[#E84E00] text-white text-sm font-bold px-6 py-3 rounded-full shadow-sm transition-colors" href="shop.html">Browse products <span aria-hidden="true" class="material-symbols-outlined text-base">arrow_forward</span></a>
</div>

</main>
<script>siteFooter()</script>
<script>
/* Runs before solomo.js boots, so only saved products become "cards".
   Un-hearting here leaves the card in place until reload, so it can be undone. */
(function () {
  var saved = [];
  try { saved = JSON.parse(localStorage.getItem('solomo.wish.v1')) || []; } catch (e) {}
  var arts = document.querySelectorAll('#product-grid article');
  for (var i = 0; i < arts.length; i++) if (saved.indexOf(arts[i].dataset.sku) === -1) arts[i].remove();
  if (!document.querySelector('#product-grid article')) {
    document.getElementById('wish-empty').hidden = false;
    document.getElementById('result-count').textContent = '0 products';
  }
})();
</script>
</body></html>
