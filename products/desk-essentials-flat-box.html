<script>
/* Gallery: click a thumbnail, swap the main image. */
document.querySelectorAll('.gal-thumb').forEach(function (t, _, all) {
  t.addEventListener('click', function () {
    document.getElementById('gal-main').src = t.dataset.src;
    all.forEach(function (o) { o.classList.toggle('border-orange-brand', o === t); o.classList.toggle('border-sand-border', o !== t); });
  });
});
</script>
